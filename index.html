<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Holistic Progress Card – template – Ahalia Public School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Midnight & gold */
:root{
  --ink:#151A2E; --deep:#1E2647; --tx:#3A4250; --mut:#7C8696; --faint:#9AA2AF;
  --pg:#FCFBF8; --tint:#F5F3ED; --line:#E7E3DA; --line2:#F0EDE5;
  --gold:#B98B2E; --goldL:#D9A441; --goldT:#E7C77B; --goldS:#FBF5E8;
  --ok:#2F6B4F; --warn:#9A5B2A;
  --navy:var(--ink); --navy-s:#ECEDF3; --orange:var(--gold); --orange-d:#8A6A28;
  --peach:var(--goldS); --peach-l:#EADFC2; --pillg:var(--ok);
  --green:var(--ok); --green-s:#EDF3EF; --blue:var(--deep); --blue-s:#EDEEF5;
  --amber:var(--gold); --amber-s:var(--goldS); --purple:#38406B; --purple-s:#EEEFF6;
  --soft:var(--tint);
  --sans:"DM Sans",system-ui,-apple-system,sans-serif;
  --disp:"Playfair Display",Georgia,"Times New Roman",serif;
  color-scheme:light only;
}
*{box-sizing:border-box}
body{margin:0;background:#E6E7EC;color:var(--tx);font:12.4px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
input,textarea,select,button{font:inherit;color:inherit}
[hidden]{display:none!important}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* toolbar */
.bar{position:sticky;top:0;z-index:30;background:var(--ink);color:#F4F2EC;padding:11px 26px;
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.bar .t{font-weight:600;font-size:14px;letter-spacing:-.015em}
.bar .t > span{color:var(--goldT)}
.bar .t small{font-weight:400;color:#9BA3BC;font-size:11.5px;margin-left:10px;padding-left:10px;
  border-left:1px solid rgba(255,255,255,.2)}
.bar .sp{flex:1}
.bar button{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.26);
  border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:12.5px;
  background:rgba(255,255,255,.08);color:#F4F2EC}
.bar button:hover{background:rgba(255,255,255,.16)}
.bar button.primary{background:var(--goldL);border-color:var(--goldL);color:#2A2308}
.bar button.primary:hover{background:#E7B757}
.bar button[aria-pressed=true]{background:var(--goldS);border-color:var(--goldS);color:#6B5112}

/* page */
.page{width:210mm;min-height:297mm;margin:26px auto;background:var(--pg);position:relative;overflow:hidden;
  padding:0 16mm 18mm;box-shadow:0 1px 3px rgba(21,26,46,.06),0 26px 52px -28px rgba(21,26,46,.5)}
.page.inner{padding-top:18mm}
.spine{display:none}
.pf{position:absolute;left:16mm;right:16mm;bottom:8mm;display:flex;justify-content:space-between;
  align-items:center;font-size:9.6px;color:var(--faint);border-top:1px solid var(--line);padding-top:7px}
.pf b{color:var(--mut);font-weight:500}.pf b span{color:var(--gold)}
.pf .pn{margin-left:8px;color:var(--ink);font-weight:600;font-family:var(--disp)}
@media screen and (max-width:840px){
  .page,.page.inner{width:auto;min-height:0;margin:10px;padding:0 0 44px}
  .page.inner{padding-top:18px}
  .pf{left:16px;right:16px}
  .page table{display:block;overflow-x:auto}
}

/* ---------- the midnight panel ---------- */
.hero{margin:0 -16mm;padding:24px 16mm 30px;position:relative;overflow:hidden;color:#F4F2EC;
  background:linear-gradient(135deg,#151A2E 0%,#1E2647 55%,#2A2F5C 100%)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(540px 280px at 88% -6%,rgba(217,164,65,.36),transparent 70%)}
.hero > *{position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{display:flex;gap:13px;align-items:center;min-width:0}
.slogo{width:68px;height:68px;flex:none;border-radius:13px;background:#fff;display:grid;place-items:center;
  overflow:hidden;cursor:pointer;padding:6px}
.slogo img{max-width:100%;max-height:100%;object-fit:contain}
.slogo .add{font-size:9px;font-weight:500;color:var(--mut);text-align:center;line-height:1.25}
.slogo.empty{background:rgba(255,255,255,.1);border:1px dashed rgba(255,255,255,.4)}
.slogo.empty .add{color:#C9CFE2}
.bname{font-weight:600;font-size:17px;color:#fff;letter-spacing:-.015em;line-height:1.25}
.bname small{display:block;font-weight:400;font-size:12px;color:#A9B2CC;margin-top:1px}
.tright{display:flex;gap:8px;align-items:center}
.eb{display:inline-flex;align-items:center;background:#fff;border:0;border-radius:11px;padding:9px 14px}
.eb img{height:30px;width:auto;display:block}

.hgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:34px;align-items:start;margin-top:26px}
@media screen and (max-width:700px){.hgrid{grid-template-columns:1fr;gap:22px}}
.badge{display:block;font-size:10.5px;color:#AEB6D0;font-weight:400}
.badge svg.i{display:none}
.hl h1{font-family:var(--disp);font-size:42px;font-weight:700;color:#fff;letter-spacing:-.02em;
  line-height:1.05;margin:10px 0 7px}
.hl .tag{font-size:13.5px;font-weight:500;color:var(--goldT);line-height:1.4}
.hl .sch{font-weight:400;color:#9BA3BC;font-size:11.2px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:0 28px;margin-top:20px}
.chip{font-size:10.4px;color:#A9B2CC;font-weight:400}
.chip b{display:block;color:#fff;font-weight:600;font-size:14px;letter-spacing:-.01em;margin-top:2px}
.cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 28px;margin-top:18px}
.cell{padding-bottom:3px;border-bottom:1px solid rgba(255,255,255,.22)}
.cell label{display:block;font-size:9.8px;color:#A9B2CC;font-weight:400}
.cell input{width:100%;border:0!important;padding:2px 0!important;font-weight:500;color:#fff;background:transparent}

/* the mark, as a card on the panel */
.qwrap{position:relative}
.qcard{position:relative;border:0;background:#fff;border-radius:16px;padding:20px 22px 18px;
  box-shadow:0 20px 40px -22px rgba(0,0,0,.65)}
.qflag{position:absolute;top:-11px;right:20px;background:var(--goldL);color:#2A2308;font-weight:600;
  font-size:10.2px;border-radius:999px;padding:4px 12px;box-shadow:none}
.qh{display:flex;align-items:baseline;gap:12px}
.qic{display:none}
.qh b.t{display:none}
.qh small{color:var(--mut);font-size:11px}
.qh .big{margin-left:auto;font-family:var(--disp);font-weight:700;font-size:48px;color:var(--ink);
  letter-spacing:-.025em;line-height:1}
.qbar{height:6px;border-radius:999px;background:var(--line);margin:14px 0 0;overflow:hidden}
.qbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--goldL))}
.qstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.qstats div{background:var(--tint);border-radius:11px;padding:11px 12px;text-align:left}
.qstats svg.i{display:none}
.qstats b{display:block;font-family:var(--disp);font-weight:700;font-size:19px;color:var(--ink);letter-spacing:-.02em}
.qstats span{font-size:9.8px;color:var(--mut)}
.ins{margin-top:14px;background:var(--goldS);border:0;border-left:3px solid var(--goldL);
  border-radius:0 11px 11px 0;padding:11px 14px}
.ins b{display:block;color:var(--orange-d);font-size:10.4px;font-weight:600}
.ins b svg.i{display:none}
.ins div{color:#5B4A22;font-size:11.4px;margin-top:3px;line-height:1.55}
.qfloat{display:none}

/* section heads */
.sec{display:flex;align-items:baseline;gap:11px;margin:30px 0 12px}
.sec .ey{font-family:var(--disp);font-size:14px;font-weight:700;color:var(--goldL)}
.sec h2{font-family:var(--disp);font-weight:700;font-size:19px;margin:0;color:var(--ink);letter-spacing:-.02em}
.sec .s{font-size:10.4px;color:var(--faint);margin-left:auto;text-align:right}
.sec .ln{display:none}

/* fields */
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media screen and (max-width:640px){.g2,.g3{grid-template-columns:1fr}}
input[type=text],textarea,select{border:0;border-bottom:1px solid var(--line);background:transparent;
  padding:3px 2px;outline:none;border-radius:0}
textarea{width:100%;resize:vertical;overflow:hidden}
input:focus,textarea:focus,select:focus{background:var(--goldS)}
.lined{display:block;border:0!important;background:repeating-linear-gradient(180deg,transparent 0 21px,var(--line) 21px 22px)!important;
  line-height:22px!important;padding:0 2px!important;min-height:44px;font-size:11.8px;color:var(--ink)}

/* edit mode */
[data-edit]{border-radius:4px;transition:box-shadow .12s,background .12s}
body.editing [data-edit]{box-shadow:0 0 0 1.5px var(--goldL);background:var(--goldS);cursor:text}
body.editing [data-edit]:focus{outline:none;box-shadow:0 0 0 2px var(--gold);background:#fff}
body.editing .hero [data-edit]{background:rgba(217,164,65,.22)}

/* effort / ability */
.card{border:0;background:var(--tint);border-radius:14px;padding:16px 18px 15px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--ink);color:var(--goldT)}
.ic svg.i{width:15px;height:15px}
.ch b{display:block;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.2;letter-spacing:-.01em}
.ch small{display:block;font-size:10.6px;color:var(--mut);font-weight:400}
.scale{display:flex;gap:6px;background:none;border:0;padding:0}
.scale label{flex:1;text-align:center;border-radius:50%;aspect-ratio:1;max-width:30px;padding:0;
  display:grid;place-items:center;cursor:pointer;font-size:11.5px;color:var(--mut);font-weight:500;
  background:#fff;border:1px solid var(--line);transition:background .12s,color .12s,border-color .12s}
.scale label:hover{border-color:var(--goldL)}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label:has(input:checked){background:var(--ink);border-color:var(--ink);color:var(--goldT)}
.nine label:nth-child(n+7):has(input:checked){background:var(--goldL);border-color:var(--goldL);color:#2A2308}
.scalecap{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:9px}

/* tables */
.tcard{border:0;background:none}
table{width:100%;border-collapse:separate;border-spacing:0}
th{font-size:10.2px;color:var(--faint);font-weight:400;text-align:left;padding:0 12px 9px 0;
  background:none;border-bottom:1px solid var(--line)}
td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:left}
.subj{font-weight:500;color:var(--ink);white-space:nowrap;font-size:13px}
.subj i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:9px;
  background:var(--goldL);vertical-align:1px}
.mk{font-family:var(--disp);font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.barc{width:11%}
.sbar{display:block;height:10px;border-radius:999px;background:#ECE8DE;overflow:hidden;padding:0}
.sbar i{display:block;height:100%;border-radius:999px;background:var(--mut)}
.sbar.ab i{background:linear-gradient(90deg,#1E7A4D,#34A26A)}
.sbar.il i{background:linear-gradient(90deg,#2B4FA8,#4F79D4)}
.sbar.bl i{background:linear-gradient(90deg,#A32B22,#D45B4A)}
.sbar.nm i{background:#D9D4C8}
.cht{font-family:var(--disp);font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.tcard th.c{line-height:1.3}
.tcard table{font-size:11.5px}
.tcard td{padding:11px 9px 11px 0}
.tcard th{padding-right:9px}
.mk{font-size:18px}

.pill{display:inline-block;padding:0;font-size:11.4px;font-weight:400;white-space:nowrap;background:none;color:var(--c)}
.pill::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;
  margin-right:7px;vertical-align:1px}
.ab{--c:#1E7A4D}.il{--c:#2B4FA8}.bl{--c:#A32B22}.nm{--c:var(--faint)}
.track{position:relative;display:block;height:6px;border-radius:999px;background:#ECE8DE;
  margin:0 0 7px;min-width:120px}
.track .seg{position:absolute;top:0;height:6px;border-radius:999px;background:var(--bc,var(--mut))}
.track .d0,.track .d1{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;margin-left:-6px;
  border:2px solid #fff;box-sizing:border-box}
.track .d0{background:#C9C2B4}
.track .d1{background:var(--bc,var(--mut));box-shadow:0 1px 4px rgba(0,0,0,.25)}
.track.ab{--bc:#1E7A4D}.track.il{--bc:#2B4FA8}.track.bl{--bc:#A32B22}
.pv{font-size:11.6px;color:var(--tx);white-space:nowrap;display:flex;gap:9px;align-items:center;
  font-variant-numeric:tabular-nums}
.pv .pill{font-size:11px}
.mini{font-size:11.4px;color:var(--faint)}
.tnote{font-size:10.2px;color:var(--faint);margin:13px 0 0;line-height:1.6;max-width:92%}

/* learning cycle */
.cycle{display:flex;gap:4px;align-items:stretch;margin-top:6px}
@media screen and (max-width:640px){.cycle{flex-wrap:wrap}.cycle .st{flex:1 1 46%}}
.cycle .st{flex:1;min-width:0;position:relative;color:#fff;background:var(--c);padding:15px 30px 16px 30px;
  clip-path:polygon(0 0,calc(100% - 17px) 0,100% 50%,calc(100% - 17px) 100%,0 100%,17px 50%)}
.cycle .st:first-child{padding-left:20px;border-radius:10px 0 0 10px;
  clip-path:polygon(0 0,calc(100% - 17px) 0,100% 50%,calc(100% - 17px) 100%,0 100%)}
.cycle .st .hd{display:none}
.cycle .st .lab{font-size:10.5px;font-weight:500;color:rgba(255,255,255,.84)}
.cycle .st > b{display:block;font-family:var(--disp);font-size:23px;font-weight:700;letter-spacing:-.02em;
  margin:3px 0 4px;color:#fff;line-height:1.1}
.cycle .st > span{display:block;font-size:9.8px;line-height:1.45;color:rgba(255,255,255,.82)}
.cycle .st.s1{--c:#1E2647}.cycle .st.s2{--c:#38406B}.cycle .st.s3{--c:#8A6A28}.cycle .st.s4{--c:#B98B2E}

/* beyond the marks */
.abil{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media screen and (max-width:640px){.abil{grid-template-columns:1fr}}
.dom{border:0;background:var(--tint);border-radius:14px;padding:14px 16px 10px}
.dom .dh{display:flex;gap:10px;align-items:center;padding:0 0 11px;border-bottom:1px solid var(--line)}
.dom .dh b{display:block;font-family:var(--disp);font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.dom .dh small{display:block;font-size:10.2px;color:var(--mut)}
.dom .ic{width:28px;height:28px;background:var(--ink);color:var(--goldT)}
.dom .it{padding:11px 0 12px;border-top:1px solid var(--line)}
.dom .it:first-of-type{border-top:0}
.dom .it div.n{font-size:11.6px;font-weight:400;margin-bottom:7px;color:var(--ink);line-height:1.4}
.dom select{display:none}
.bpa{gap:4px}
.bpa label{aspect-ratio:auto;max-width:none;border-radius:999px;padding:4px 0;font-size:10.6px}
.bpa label:nth-child(3):has(input:checked){background:var(--goldL);border-color:var(--goldL);color:#2A2308}

/* teacher's note */
.note{position:relative;padding:18px 20px 16px;background:var(--goldS);border:0;border-radius:14px;overflow:hidden}
.note::after{content:"\201C";position:absolute;right:20px;top:-14px;font:700 92px/1 "Playfair Display",Georgia,serif;
  color:rgba(185,139,46,.16)}
.note .nh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
  margin-bottom:9px;position:relative;z-index:1}
.note .nh b{display:flex;gap:7px;align-items:center;font-family:var(--disp);font-size:14px;
  color:var(--ink);font-weight:700}
.note .nh b svg.i{display:none}
.stamp{font-size:10.2px;font-weight:500;color:var(--orange-d);background:#fff;border:0;border-radius:999px;padding:3px 11px}
.note textarea{background:transparent;border:0;padding:0;font-size:12.1px;line-height:1.75;min-height:0;
  color:#4A3E1E;position:relative;z-index:1}
.note.ok{background:#EFF4F0}
.note.ok::after{color:rgba(47,107,79,.14)}
.note.ok .nh b,.note.ok textarea{color:#22402F}
.note.ok .stamp{color:var(--ok)}
.ok-l{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:11px;color:var(--mut)}
.plan td textarea{min-height:0;border:0;padding:2px 0;background:transparent;line-height:1.5;font-size:11.8px}
.tg td textarea{border-bottom:1px solid var(--line)}
.plan .k{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);
  color:var(--goldT);font-family:var(--disp);font-size:11px;font-weight:700;margin-right:10px}
.when{display:inline-block;background:var(--tint);border:0;border-radius:999px;padding:3px 10px;
  font-size:10.6px;color:var(--mut);white-space:nowrap}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:40px}
.sign div{border-top:1px solid var(--ink);padding-top:7px;display:flex;justify-content:space-between;
  color:var(--mut);font-size:10.8px}
.sign div span{color:var(--faint)}

@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .bar,.noprint{display:none!important}
  .page{margin:0;box-shadow:none;break-after:page;width:210mm;height:297mm;min-height:297mm;overflow:hidden}
  input:focus,textarea:focus{background:transparent}
  textarea{resize:none}
  select{appearance:none;-webkit-appearance:none}
  body.editing [data-edit]{box-shadow:none;background:none}
  .slogo.empty{display:none}
  .note:not(.ok) .stamp::after{content:" · not for issue"}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

</style>
</head>
<body>
<div class="bar noprint">
  <span class="t">Holistic Progress <span>Card</span><small id="tbName"></small></span>
  <div class="lg">
    <span><i style="background:var(--green)"></i>From school &amp; EduBrisk data</span>
    <span><i style="background:var(--orange)"></i>Suggested – teacher to review</span>
    <span><i style="background:#fff;border:1px solid #CBD5E1"></i>To be completed</span>
  </div>
  <span class="sp"></span>
  <button id="btnLogo" type="button">School logo</button>
  <input type="file" id="logoFile" accept="image/*" hidden>
  <button id="btnEdit" type="button" aria-pressed="false" title="Turn on to change any pre-filled figure or wording on the card">Edit card text</button>
  <button id="btnSave" type="button">Download filled copy</button>
  <button class="primary" id="btnPrint" type="button">Print / Save as PDF <svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>

            <div>${IC.up}<b class="num">${E(S.gain != null ? '+' + r1(S.gain) : '—')}</b><span>Retake gain</span></div>
          </div>
          <div class="ins"><b>${IC.star}Key insight</b><div>${E(esc(S.insight))}</div></div>
        </div>
        
      </div>
    </div>
  </div>

  ${sec('Attainment and progress', 'school assessments, as held in iAspire')}
  <div class="tcard"><table>
    <tr><th>Subject</th><th class="c">Mark</th><th>Attainment</th><th></th><th>Progress between exams</th><th class="c">Assessment<br>for learning</th><th class="c">Assessment<br>of learning</th><th class="c">Chapters /<br>tests</th></tr>
    ${rows}
  </table></div>
  <p class="tnote">${E(`Attainment: 70%+ Above expectation, 50–69% In line, under 50% Below. Progress compares two school exams by ten-point band.${S.progNote ? ' ' + S.progNote : ''} Assessment for learning is the average first try on the diagnostic set, taken before the chapter is taught; assessment of learning is the first try on the quiz that follows it. Chapters / tests counts chapters practised against tests attempted. The bar beside each mark is coloured by its attainment band.`)}</p>

  ${sec('The EduBrisk learning cycle', 'every chapter: prepare, learn, test, celebrate')}
  <div class="cycle">
    <div class="st s1"><div class="lab">Prepare</div><b class="num">${E(pc(S.cycle.prep))}</b><span>${E('average first try on diagnostic tests, before teaching')}</span></div>
    <div class="st s2"><div class="lab">Learn</div><b class="num">${E(S.cycle.chapters + ' chapters')}</b><span>${E(hm(S.hours) + ' of study across ' + subs.filter((s) => (S.subj || {})[s]).length + ' subjects')}</span></div>
    <div class="st s3"><div class="lab">Test</div><b class="num">${E(pc(S.cycle.test))}</b><span>${E('average first try on quizzes after teaching')}</span></div>
    <div class="st s4"><div class="lab">Celebrate</div><b class="num">${E(S.gain != null ? '+' + r1(S.gain) : '—')}</b><span>${E('points gained on ' + S.retaken + ' retaken tests')}</span></div>
  </div>`, 'first');

/* ================================================================ page 2 */
const DOM = [['Awareness', 'knowing and communicating', 'd1', 'bulb', 'blue', ['Language and communication', 'Knowledge and understanding', 'Digital, health and environmental literacy']],
  ['Sensitivity', 'working with and caring for others', 'd2', 'users', 'green', ['Collaboration and teamwork', 'Empathy, values and respect', 'Citizenship and responsibility']],
  ['Creativity', 'thinking and making', 'd3', 'brain', 'amber', ['Critical thinking and problem-solving', 'Creativity and innovation', 'Scientific temper and curiosity']]];
const EVID = ['Group project', 'Individual inquiry', 'Classroom interaction', 'Co-curricular activity', 'Observation over the term'];
const tgtSubs = subs.filter((s) => (S.score || {})[s] != null || (S.prog || {})[s]);
H += page(`
  ${sec('Effort and ability', 'teacher judgment, 1 to 9, kept separate on purpose')}
  <div class="grid g2">
    <div class="card"><div class="ch">${icon('bolt', 'amber')}<div><b>Effort</b><small>how hard ${esc(S.first)} works</small></div></div>${scale(['1', '2', '3', '4', '5', '6', '7', '8', '9'], 'nine')}<div class="scalecap"><span>Low</span><span>Developing</span><span>High</span></div></div>
    <div class="card"><div class="ch">${icon('gauge', 'blue')}<div><b>Ability</b><small>what ${esc(S.first)} can do</small></div></div>${scale(['1', '2', '3', '4', '5', '6', '7', '8', '9'], 'nine')}<div class="scalecap"><span>Low</span><span>Developing</span><span>High</span></div></div>
  </div>

  ${sec('Targets', 'set by the subject teacher for the next exam')}
  <div class="tcard"><table class="plan tg"><tr><th style="width:26%">Subject</th><th>Base target</th><th>Challenge target</th></tr>
    ${tgtSubs.map((s) => `<tr><td class="subj">${sdot(s)}${s}</td><td>${ta(1)}</td><td>${ta(1)}</td></tr>`).join('')}
  </table></div>

  ${sec('Beyond the marks', 'levels the teacher has seen this term')}
  <div class="abil">${DOM.map(([d, sub, c, ic, col, xs]) => `<div class="dom ${c}"><div class="dh">${icon(ic, col)}<div><b>${d}</b><small>${sub}</small></div></div>${xs.map((x) => `<div class="it"><div class="n">${x}</div>${scale(['Beginner', 'Proficient', 'Advanced'], 'bpa')}</div>`).join('')}</div>`).join('')}</div>

  `);

/* ================================================================ page 3 */
H += page(`
  ${sec("Teacher's note", 'drafted from the evidence; the class teacher edits and approves it')}
  <div class="note" id="sugNote"><div class="nh"><b>${IC.star}Strengths and areas to work on</b><span class="stamp" id="sugStamp">Suggested – teacher to review</span></div>
    ${ta(6, S.suggest.note, 'id="sugText"')}
    <label class="ok-l noprint"><input type="checkbox" id="sugOk"> I have reviewed this note and it can be issued.</label></div>

  ${sec('Support plan', 'prepared by the school from the evidence')}
  <div class="tcard"><table class="plan"><tr><th style="width:26%">Focus</th><th>Action</th><th style="width:17%">Who</th><th style="width:15%">Review by</th></tr>
    ${S.suggest.plan.map((r, n) => `<tr><td class="subj"><span class="k">${n + 1}</span>${E(esc(r[0]))}</td><td>${E(esc(r[1]))}</td><td>${E(esc(r[2]))}</td><td><span class="when">${E(esc(r[3]))}</span></td></tr>`).join('')}
  </table></div>

  <div class="sign"><div>Class teacher<span>Date</span></div><div>Principal<span>Date</span></div><div>Parent / guardian<span>Date</span></div></div>`);

$('#doc').innerHTML = H;
$('#tbName').textContent = `Template · sample data · ${S.name} · Grade ${S.g}${secL}`;

/* ================================================================ behaviour */
function fit(t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }
document.querySelectorAll('textarea:not(.lined)').forEach(fit);
document.addEventListener('input', (e) => { if (e.target.tagName === 'TEXTAREA') fit(e.target); });
window.addEventListener('beforeprint', () => document.querySelectorAll('textarea').forEach((t) => { if (!t.classList.contains('lined') || t.value) fit(t); }));
function sync() {
  const ok = $('#sugOk').checked;
  $('#sugNote').classList.toggle('ok', ok);
  $('#sugStamp').textContent = ok ? 'Reviewed by teacher' : 'Suggested – teacher to review';
}
document.addEventListener('change', sync); sync();

/* edit mode: every pre-filled figure and line of wording becomes typeable */
function setEdit(on) {
  document.body.classList.toggle('editing', on);
  document.querySelectorAll('[data-edit]').forEach((e) => { if (on) e.setAttribute('contenteditable', 'true'); else e.removeAttribute('contenteditable'); });
  $('#btnEdit').setAttribute('aria-pressed', on);
  $('#btnEdit').textContent = on ? 'Done editing' : 'Edit card text';
}
$('#btnEdit').onclick = () => setEdit(!document.body.classList.contains('editing'));
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.hasAttribute && e.target.hasAttribute('contenteditable')) { e.preventDefault(); e.target.blur(); } });

/* school logo: picked once, kept inside the file so a downloaded copy carries it */
const pickLogo = () => $('#logoFile').click();
$('#btnLogo').onclick = pickLogo;
document.addEventListener('click', (e) => { if (e.target.closest && e.target.closest('#slogo')) pickLogo(); });
$('#logoFile').onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { const s = $('#slogo'); s.classList.remove('empty'); s.innerHTML = `<img src="${rd.result}" alt="School logo">`; };
  rd.readAsDataURL(f);
};
$('#btnPrint').onclick = () => { setEdit(false); window.print(); };
/* the filled copy bakes every entry into the markup, so it reopens exactly as it was left */
$('#btnSave').onclick = () => {
  setEdit(false);
  document.querySelectorAll('input').forEach((i) => {
    if (i.type === 'checkbox' || i.type === 'radio') { if (i.checked) i.setAttribute('checked', ''); else i.removeAttribute('checked'); }
    else if (i.type !== 'file') i.setAttribute('value', i.value);
  });
  document.querySelectorAll('textarea').forEach((t) => { t.textContent = t.value; });
  document.querySelectorAll('select').forEach((s) => [...s.options].forEach((o) => { if (o.selected) o.setAttribute('selected', ''); else o.removeAttribute('selected'); }));
  const html = '<!DOCTYPE html>\n<html lang="en">' + document.documentElement.innerHTML
    .replace("$('#doc').innerHTML = H;", "if (!document.querySelector('#doc').children.length) $('#doc').innerHTML = H;") + '</html>';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  a.download = 'index.html';
  document.body.append(a); a.click(); a.remove();
};
</script>
</body>
</html>
