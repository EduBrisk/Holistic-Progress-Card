<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Holistic Progress Card – Akshita K B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* TeachScope360 palette: navy #1E3A5F, orange #E07B39, with the dashboard's blue, green, purple and orange */
:root{
  --navy:#1E3A5F; --navy2:#224169; --navy-s:#E8EEF6; --orange:#E07B39; --orange-d:#C2410C; --peach:#FFF7ED; --peach-l:#FED7AA;
  --blue:#2563EB; --blue-s:#DBEAFE; --blue-p:#EFF6FF; --green:#16A34A; --green-s:#DCFCE7; --green-p:#F0FDF4; --pillg:#48BB78;
  --purple:#9333EA; --purple-s:#F3E8FF; --purple-p:#FAF5FF; --amber:#EA580C; --amber-s:#FFEDD5;
  --ink:#111827; --text:#374151; --muted:#6B7280; --faint:#9CA3AF; --line:#E5E7EB; --line2:#F1F3F6; --soft:#F9FAFB; --bg:#EEF1F5;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --sh1:0 1px 2px rgba(17,24,39,.04),0 2px 8px -2px rgba(17,24,39,.06);
  --sh2:0 2px 4px rgba(30,58,95,.04),0 18px 40px -16px rgba(30,58,95,.28);
  color-scheme:light only;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:12.2px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
input,textarea,select,button{font:inherit;color:inherit}
[hidden]{display:none!important}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- toolbar: the TeachScope top navigation ---------- */
.bar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.bar .t{font-weight:800;font-size:14.5px;color:var(--navy);letter-spacing:-.01em}
.bar .t > span{color:var(--orange)}
.bar .t small{font-weight:500;color:var(--muted);font-size:12px;margin-left:10px;padding-left:10px;border-left:1px solid var(--line)}
.bar .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.bar .lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.bar .sp{flex:1}
.bar button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:12.5px;background:#fff;color:var(--ink);transition:background .15s,box-shadow .15s}
.bar button:hover{background:var(--soft)}
.bar button.primary{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 6px 16px -8px rgba(30,58,95,.8)}
.bar button.primary:hover{background:var(--navy2)}
.bar button[aria-pressed=true]{background:var(--peach);border-color:var(--peach-l);color:var(--orange-d)}

/* ---------- page ---------- */
.page{width:210mm;min-height:297mm;margin:26px auto;background:#fff;padding:0 12mm 15mm;position:relative;box-shadow:0 1px 3px rgba(17,24,39,.06),0 24px 50px -28px rgba(17,24,39,.35);border-radius:8px;overflow:hidden}
.page.inner{padding-top:11mm}
@media screen and (max-width:840px){.page,.page.inner{width:auto;min-height:0;margin:12px;padding:16px 14px 44px}.page table{display:block;overflow-x:auto}}
.page::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--navy) 0 64%,var(--orange) 64%);z-index:2}
.pf{position:absolute;left:12mm;right:12mm;bottom:6mm;display:flex;justify-content:space-between;align-items:center;font-size:9.5px;color:var(--faint)}
.pf b{color:var(--navy);font-weight:800;letter-spacing:-.01em}.pf b span{color:var(--orange)}
.pf .pn{background:var(--navy);color:#fff;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px}

/* ---------- hero, after the TeachScope landing page ---------- */
.hero{margin:0 -12mm;padding:12mm 12mm 18px;position:relative;
  background:
    radial-gradient(420px 220px at 92% 18%,rgba(224,123,57,.13),transparent 70%),
    radial-gradient(380px 240px at 4% 96%,rgba(37,99,235,.08),transparent 70%),
    radial-gradient(circle,#E3E8EF 1px,transparent 1.2px) 0 0/15px 15px,
    linear-gradient(180deg,#FBFCFE,#fff);
  border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.slogo{width:54px;height:54px;flex:none;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;cursor:pointer;box-shadow:var(--sh1)}
.slogo img{max-width:86%;max-height:86%;object-fit:contain}
.slogo .add{font-size:9.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.25;padding:3px}
.slogo.empty{border:1.5px dashed #CBD5E1;box-shadow:none;background:rgba(255,255,255,.7)}
.bname{font-weight:800;font-size:15.5px;color:var(--navy);letter-spacing:-.015em;line-height:1.2}
.bname small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0;margin-top:1px}
.tright{display:flex;gap:8px;align-items:center}
.eb{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:10.5px;color:var(--muted);font-weight:600;background:#fff;box-shadow:var(--sh1)}
.eb img{height:16px;width:auto;display:block}
.hgrid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:26px;align-items:center;margin-top:16px}
@media screen and (max-width:700px){.hgrid{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--peach);border:1px solid var(--peach-l);color:var(--orange);font-weight:600;font-size:10.8px;border-radius:999px;padding:4px 12px}
.badge svg.i{width:13px;height:13px}
.hl h1{font-size:36px;font-weight:900;color:var(--navy);letter-spacing:-.035em;line-height:1.02;margin:12px 0 4px}
.hl .tag{font-size:19px;font-weight:800;color:var(--orange);letter-spacing:-.025em;line-height:1.15}
.hl .sch{font-weight:500;color:var(--muted);font-size:12.2px;margin-top:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:10.8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 9px;color:var(--muted);box-shadow:var(--sh1)}
.chip b{color:var(--navy);font-weight:800}
.cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}
.cell{background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:9px;padding:4px 9px 3px}
.cell label{display:block;font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:700}
.cell input{width:100%;border:0!important;padding:1px 0!important;font-weight:600;color:var(--ink);background:transparent}

/* the student card, after the Teaching Quality Index card */
.qwrap{position:relative;padding:12px 0 24px}
.qcard{position:relative;border:1px solid var(--line);border-radius:18px;background:#fff;padding:16px 16px 14px;box-shadow:var(--sh2)}
.qflag{position:absolute;top:-12px;right:16px;background:var(--pillg);color:#fff;font-weight:700;font-size:11px;border-radius:999px;padding:5px 14px;box-shadow:0 6px 14px -4px rgba(72,187,120,.6)}
.qh{display:flex;align-items:center;gap:10px}
.qic{width:36px;height:36px;border-radius:10px;background:var(--blue-s);color:var(--blue);display:grid;place-items:center;flex:none}
.qh b.t{display:block;font-weight:700;color:var(--ink);font-size:13px}
.qh small{color:var(--muted);font-size:11px}
.qh .big{margin-left:auto;font-weight:900;font-size:27px;color:var(--green);letter-spacing:-.03em}
.qbar{height:8px;border-radius:999px;background:#EEF0F3;margin:12px 0 12px;overflow:hidden}
.qbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--navy),#2F5A8F)}
.qstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qstats div{background:var(--soft);border:1px solid var(--line2);border-radius:11px;padding:8px 6px 7px;text-align:center}
.qstats svg.i{width:15px;height:15px;color:var(--navy);margin:0 auto 3px;display:block}
.qstats div:nth-child(2) svg.i{color:var(--orange)}.qstats div:nth-child(3) svg.i{color:var(--green)}
.qstats b{display:block;font-weight:800;font-size:15.5px;color:var(--ink);letter-spacing:-.01em}
.qstats span{font-size:9.8px;color:var(--muted)}
.ins{margin-top:10px;background:var(--peach);border:1px solid var(--peach-l);border-radius:11px;padding:8px 11px}
.ins b{display:flex;gap:6px;align-items:center;color:var(--orange-d);font-size:11.3px;font-weight:700}
.ins b svg.i{width:13px;height:13px;color:var(--orange)}
.ins div{color:#9A3412;font-size:11px;margin-top:2px}
/* the floating chip, after "Very Good Rating" */
.qfloat{position:absolute;left:-18px;bottom:0;display:flex;gap:9px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px 13px 8px 9px;box-shadow:var(--sh2)}
.qfloat .ok{width:30px;height:30px;border-radius:50%;background:var(--green-s);color:var(--green);display:grid;place-items:center;flex:none}
.qfloat b{display:block;font-size:11.8px;color:var(--ink);font-weight:700;line-height:1.2}
.qfloat small{display:block;font-size:10px;color:var(--muted)}
@media screen and (max-width:700px){.qfloat{left:8px}}

/* ---------- section heads ---------- */
.sec{display:flex;align-items:flex-end;gap:12px;margin:15px 0 8px}
.sec .ey{font-size:10px;font-weight:800;color:var(--orange);letter-spacing:.08em;line-height:1;padding-bottom:5px}
.sec h2{font-weight:800;font-size:16px;margin:0;color:var(--navy);letter-spacing:-.02em;line-height:1.1}
.sec .s{font-size:10.8px;color:var(--faint);margin-left:auto;text-align:right;padding-bottom:1px}
.sec .ln{flex:1;height:1px;background:var(--line);margin-bottom:5px;min-width:16px}

/* ---------- fields ---------- */
.grid{display:grid;gap:9px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media screen and (max-width:640px){.g2,.g3{grid-template-columns:1fr}}
input[type=text],textarea,select{border:0;border-bottom:1px solid #D1D5DB;background:transparent;padding:2px 4px;outline:none;border-radius:0}
textarea{width:100%;resize:vertical;overflow:hidden}
input:focus,textarea:focus,select:focus{background:#FFFBEB}
/* lined writing space */
.lined{display:block;border:0!important;background:repeating-linear-gradient(180deg,transparent 0 21px,#E5E7EB 21px 22px)!important;line-height:22px!important;padding:0 2px!important;min-height:44px;font-size:11.8px;color:var(--ink)}

/* ---------- edit mode ---------- */
[data-edit]{border-radius:4px;transition:box-shadow .15s,background .15s}
body.editing [data-edit]{box-shadow:0 0 0 1.5px rgba(224,123,57,.7);background:rgba(255,237,213,.45);cursor:text}
body.editing [data-edit]:focus{outline:none;box-shadow:0 0 0 2px var(--orange);background:rgba(255,237,213,.8)}

/* ---------- cards, scales ---------- */
.card{border:1px solid var(--line);border-radius:14px;padding:10px 13px 9px;background:#fff;box-shadow:var(--sh1)}
.ch{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--s,var(--blue-s));color:var(--c,var(--blue))}
.ic svg.i{width:15px;height:15px}
.ch b{display:block;font-size:12px;font-weight:700;color:var(--ink);line-height:1.2}
.ch small{display:block;font-size:10.3px;color:var(--muted)}
.scale{display:flex;gap:3px;background:var(--soft);border:1px solid var(--line2);border-radius:10px;padding:3px}
.scale label{flex:1;text-align:center;border-radius:7px;padding:3px 0;cursor:pointer;font-size:10.8px;color:var(--muted);font-weight:600;transition:all .12s;white-space:nowrap}
.scale label:hover{background:#fff;color:var(--ink)}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label:has(input:checked){background:var(--navy);color:#fff;box-shadow:0 2px 6px -2px rgba(30,58,95,.6)}
.nine label:nth-child(-n+3):has(input:checked){background:var(--amber)}
.nine label:nth-child(n+4):nth-child(-n+6):has(input:checked){background:var(--blue)}
.nine label:nth-child(n+7):has(input:checked){background:var(--green)}
.bpa label:nth-child(1):has(input:checked){background:var(--orange)}
.bpa label:nth-child(2):has(input:checked){background:var(--blue)}
.bpa label:nth-child(3):has(input:checked){background:var(--green)}
.mood label:has(input:checked){background:var(--purple)}
.scalecap{display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);margin-top:4px;padding:0 3px}
.scalecap span:nth-child(2){color:var(--muted)}

/* ---------- tables ---------- */
.tcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh1);background:#fff}
table{width:100%;border-collapse:separate;border-spacing:0}
th{font-size:9.6px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:8px 9px;background:var(--soft);border-bottom:1px solid var(--line)}
td{padding:7px 9px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
.subj{font-weight:700;color:var(--ink);white-space:nowrap}
.subj i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:7px;background:var(--c,var(--navy));vertical-align:0}
.mk{font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px 2px 7px;font-size:10.4px;font-weight:600;white-space:nowrap;background:var(--s);color:var(--c)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.ab{--c:#15803D;--s:var(--green-s)}.il{--c:#1D4ED8;--s:var(--blue-s)}.bl{--c:var(--orange-d);--s:var(--amber-s)}.nm{--c:var(--muted);--s:#F3F4F6}
.track{position:relative;height:5px;border-radius:3px;background:#EEF0F3;margin:6px 0 4px;min-width:110px}
.track .seg{position:absolute;top:0;height:5px;border-radius:3px;background:linear-gradient(90deg,#94A3B8,var(--navy))}
.track .d0,.track .d1{position:absolute;top:-4px;width:13px;height:13px;border-radius:50%;margin-left:-6.5px;border:2.5px solid #fff}
.track .d0{background:#94A3B8;box-shadow:0 0 0 1px #CBD5E1}.track .d1{background:var(--navy);box-shadow:0 0 0 1px var(--navy),0 2px 6px rgba(30,58,95,.4)}
.pv{font-size:10.4px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.mini{font-size:10.4px;color:var(--faint)}
.tnote{font-size:9.6px;color:var(--faint);margin:7px 2px 0;line-height:1.5}

/* ---------- learning cycle ---------- */
.cycle{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media screen and (max-width:640px){.cycle{grid-template-columns:1fr 1fr}}
.st{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#fff;box-shadow:var(--sh1);position:relative}
.st:not(:last-child)::after{content:"";position:absolute;right:-10px;top:50%;width:8px;height:8px;border-top:2px solid #CBD5E1;border-right:2px solid #CBD5E1;transform:translateY(-50%) rotate(45deg)}
.st .hd{display:flex;justify-content:space-between;align-items:center}
.st .hd i{font-style:normal;font-size:9.5px;font-weight:700;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.st .lab{font-size:12px;font-weight:700;color:var(--ink);margin-top:6px}
.st > b{display:block;font-size:22px;font-weight:900;color:var(--c);letter-spacing:-.03em;margin:1px 0 1px;line-height:1.15}
.st > span{font-size:10.2px;color:var(--muted);line-height:1.35;display:block}
.s1{--c:var(--blue);--s:var(--blue-s)}.s2{--c:var(--green);--s:var(--green-s)}.s3{--c:var(--purple);--s:var(--purple-s)}.s4{--c:var(--amber);--s:var(--amber-s)}
.s4{background:linear-gradient(180deg,#FFFAF4,#fff)}

/* ---------- abilities ---------- */
.abil{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media screen and (max-width:640px){.abil{grid-template-columns:1fr}}
.dom{border-radius:14px;border:1px solid var(--line);overflow:hidden;box-shadow:var(--sh1);background:#fff}
.dom .dh{display:flex;gap:9px;align-items:center;padding:9px 11px;background:linear-gradient(180deg,var(--p),#fff);border-bottom:1px solid var(--line2)}
.dom .dh b{display:block;font-size:13px;font-weight:800;color:var(--c);letter-spacing:-.01em}
.dom .dh small{display:block;font-size:9.8px;color:var(--muted)}
.dom .it{padding:5px 11px 6px;border-top:1px solid var(--line2)}
.dom .it:first-of-type{border-top:0}
.dom .it div.n{font-size:11px;font-weight:600;margin-bottom:4px;color:var(--ink)}
.dom select{width:100%;font-size:10.3px;color:var(--muted);margin-top:3px;border-bottom:1px dashed #D1D5DB}
.d1{--c:var(--blue);--s:var(--blue-s);--p:var(--blue-p)}.d2{--c:var(--green);--s:var(--green-s);--p:var(--green-p)}.d3{--c:var(--orange);--s:var(--amber-s);--p:var(--peach)}

/* ---------- voices ---------- */
.voice{border-radius:14px;padding:9px 12px 6px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh1);position:relative;overflow:hidden}
.voice::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.v1{--c:var(--blue);--s:var(--blue-s)}.v2{--c:var(--green);--s:var(--green-s)}.v3{--c:var(--orange);--s:var(--amber-s)}.v4{--c:var(--purple);--s:var(--purple-s)}
.who{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c);margin-left:auto;align-self:flex-start;background:var(--s);border-radius:999px;padding:1px 7px}

/* ---------- teacher's note: the Key Insight box ---------- */
.note{position:relative;border-radius:14px;padding:12px 14px 10px 16px;background:linear-gradient(135deg,#FFF7ED,#FFFBF6);border:1px solid var(--peach-l);overflow:hidden}
.note::after{content:"\201C";position:absolute;right:16px;top:-8px;font:900 80px/1 Georgia,serif;color:rgba(224,123,57,.12)}
.note .nh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;position:relative;z-index:1}
.note .nh b{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--orange-d);font-weight:800}
.stamp{font-size:9.8px;font-weight:700;color:var(--orange-d);background:#fff;border:1px solid var(--peach-l);border-radius:999px;padding:2px 9px}
.note textarea{background:transparent;border:0;padding:0;font-size:11.9px;line-height:1.6;min-height:0;color:#7C2D12;position:relative;z-index:1}
.note.ok{background:linear-gradient(135deg,#F0FDF4,#F8FEFA);border-color:#BBF7D0}.note.ok::after{color:rgba(22,163,74,.12)}.note.ok .nh b,.note.ok textarea{color:#166534}.note.ok .stamp{border-color:#BBF7D0;color:#15803D}
.ok-l{display:flex;gap:7px;align-items:center;margin-top:7px;font-size:11px;color:var(--muted)}
.plan td textarea{min-height:0;border:0;padding:2px 0;background:transparent;line-height:1.35;font-size:11.2px}
.tg td textarea{border-bottom:1px dashed #D1D5DB}
.tg td{padding-top:5px;padding-bottom:5px}
.plan .k{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--navy-s);color:var(--navy);font-size:10px;font-weight:800;margin-right:8px}
.when{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:1px 7px;font-size:10.4px;color:var(--muted);white-space:nowrap}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:24px}
.sign div{border-top:1.5px solid var(--navy);padding-top:5px;display:flex;justify-content:space-between;color:var(--muted);font-size:10.6px}
.sign div span{color:var(--faint)}

@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .bar,.noprint{display:none!important}

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const r1 = (n) => (n == null ? '—' : String(Math.round(n * 10) / 10));
const pc = (n) => (n == null ? '—' : Math.round(n) + '%');
const hm = (h) => { if (!h) return '0m'; const H = Math.floor(h), M = Math.round((h - H) * 60); return (H ? H + 'h ' : '') + (M ? M + 'm' : ''); };
const S = STU, secL = S.sec.replace(S.g, '');
const LV = { High: 'High Achiever', Middle: 'Middle Achiever', Low: 'Needs support' };
const band = (m) => (m == null ? ['No mark yet', 'nm'] : m >= 70 ? ['Above expectation', 'ab'] : m >= 50 ? ['In line', 'il'] : ['Below expectation', 'bl']);
const PCAT = { b: ['Better than expected', 'ab'], e: ['Expected', 'il'], w: ['Below expected', 'bl'] };
const E = (v, tag = 'span', cls = '') => `<${tag} data-edit ${cls ? `class="${cls}"` : ''}>${v}</${tag}>`;
let PG = 0; const TOTAL = 3;
const page = (h, cls = 'inner') => `<section class="page ${cls}">${h}<div class="pf"><span>${esc(S.name)} · Grade ${S.g}${secL} · ${esc(SCHOOL.short)}</span><span><b>Holistic Progress <span>Card</span></b> · 2026–27<span class="pn">${++PG} / ${TOTAL}</span></span></div></section>`;
const cell = (l) => `<div class="cell"><label>${l}</label><input type="text"></div>`;
const ta = (rows = 2, v = '', a = '') => `<textarea rows="${rows}" ${a}>${esc(v)}</textarea>`;
const lined = (rows = 2) => `<textarea class="lined" rows="${rows}"></textarea>`;
let SN = 0; const sec = (t, s) => `<div class="sec"><span class="ey">${String(++SN).padStart(2, '0')}</span><h2>${t}</h2><span class="ln"></span>${s ? `<span class="s">${s}</span>` : ''}</div>`;
let SC = 0; const scale = (ls, cls = '') => { const n = 'r' + (++SC); return `<div class="scale ${cls}">${ls.map((l) => `<label><input type="radio" name="${n}" value="${esc(l)}">${l}</label>`).join('')}</div>`; };
const svg = (d) => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
const IC = {
  spark: svg('<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>'),
  cap: svg('<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>'),
  clip: svg('<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 13l2 2 4-4"/>'),
  clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  up: svg('<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>'),
  star: svg('<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>'),
  check: svg('<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/>'),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),
  book: svg('<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>'),
  pen: svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'),
  award: svg('<circle cx="12" cy="9" r="6"/><path d="M8.5 14 7 21l5-3 5 3-1.5-7"/>'),
  bolt: svg('<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'),
  brain: svg('<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a2 2 0 0 0-3-1z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/>'),
  users: svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>'),
  bulb: svg('<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>'),
  target: svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>'),
  heart: svg('<path d="M12 20s-7-4.4-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.6-9 9-9 9z"/>'),
  home: svg('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'),
  smile: svg('<circle cx="12" cy="12" r="9"/><path d="M8.5 14a4 4 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/>'),
  flag: svg('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'),
  gauge: svg('<path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/>'),
  trophy: svg('<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M10 17h4M9 21h6M12 13v4"/>'),
};
const icon = (k, c) => `<span class="ic" style="--c:var(--${c});--s:var(--${c}-s)">${IC[k]}</span>`;

const ORD = ['English', 'Hindi', 'Tamil', 'Mathematics', 'Science', 'Social Science', 'Artificial Intelligence', 'Information Technology'];
const SCOL = { English: 'blue', Hindi: 'orange', Tamil: 'orange', Mathematics: 'purple', Science: 'green', 'Social Science': 'amber' };
const subs = [...new Set([...Object.keys(S.score || {}), ...Object.keys(S.subj || {}), ...Object.keys(S.prog || {})])]
  .sort((a, b) => ((ORD.indexOf(a) + 1) || 99) - ((ORD.indexOf(b) + 1) || 99));
const sdot = (s) => `<i style="--c:var(--${SCOL[s] || 'navy'})"></i>`;

let H = '';
/* ================================================================ page 1 */
const rows = subs.map((s) => {
  const e = (S.subj || {})[s] || {}, m = (S.score || {})[s], p = (S.prog || {})[s], [bl, bc] = band(m);
  let prog = '<span class="mini">Not measured</span>';
  if (p) {
    const [b0, c0, k] = p, lo = Math.min(b0, c0), hi = Math.max(b0, c0), cls = PCAT[k][1];
    prog = `<div><div class="track"><span class="seg" style="left:${lo}%;width:${hi - lo}%"></span><span class="d0" style="left:${b0}%"></span><span class="d1" style="left:${c0}%"></span></div>
      <span class="pv">${E(r1(b0) + '% → ' + r1(c0) + '%', 'span', 'num')}<span class="pill ${cls}">${E(PCAT[k][0])}</span></span></div>`;
  }
  return `<tr><td class="subj">${sdot(s)}${s}</td><td class="c">${m != null ? E(r1(m) + '%', 'span', 'mk num') : '<span class="mini">—</span>'}</td>
    <td><span class="pill ${bc}">${E(bl)}</span></td><td style="width:33%">${prog}</td>
    <td class="c num">${E(e.nD ? pc(e.diag) : '—')}</td><td class="c num">${E(e.nA ? pc(e.after) : '—')}</td><td class="c mini num">${E((e.chapters || 0) + ' / ' + (e.tests || 0))}</td></tr>`;
}).join('');
const progEntry = Object.entries(S.prog || {})[0];
H += page(`
  <div class="hero">
    <div class="top"><div class="brand"><div class="slogo ${SCHOOL.logo ? '' : 'empty'}" id="slogo" title="Click to add or change the school logo">${SCHOOL.logo ? `<img src="${SCHOOL.logo}" alt="School logo">` : '<span class="add noprint">+ Add<br>logo</span>'}</div>
        <div class="bname">${E(esc(SCHOOL.short))}<small>${E(esc(SCHOOL.place || 'Holistic Progress Card'))}</small></div></div>
      <div class="tright"><span class="eb"><img src="${EBLOGO}" alt="EduBrisk">iAspire</span></div></div>
    <div class="hgrid">
      <div class="hl">
        <span class="badge">${IC.spark}${E('Holistic Progress Card · Term 1 · 2026–27')}</span>
        <h1>${E(esc(S.name))}</h1>
        <div class="tag">${E('Learning, growth &amp; next steps')}</div>
        <div class="sch">${E(esc(SCHOOL.name))}</div>
        <div class="chips"><span class="chip">Grade <b>${E(S.g)}</b></span><span class="chip">Section <b>${E(secL)}</b></span><span class="chip">Roll no. <b>${E(S.roll)}</b></span><span class="chip">Adm. no. <b>${E(S.adm)}</b></span></div>
        <div class="cells">${cell('Date of birth')}${cell('APAAR ID')}${cell('Class teacher')}${cell('Attendance')}</div>
      </div>
      <div class="qwrap">
        <div class="qcard">
          <span class="qflag">${E(LV[S.level] || 'Achiever level')}</span>
          <div class="qh"><span class="qic">${IC.cap}</span><div><b class="t">Attainment</b><small>Average internal mark</small></div><b class="big num">${E(pc(S.avg))}</b></div>
          <div class="qbar"><i style="width:${Math.max(0, Math.min(100, S.avg || 0))}%"></i></div>
          <div class="qstats">
            <div>${IC.clip}<b class="num">${E(String(S.tests))}</b><span>Tests on EduBrisk</span></div>
            <div>${IC.clock}<b class="num">${E(hm(S.hours))}</b><span>Study time</span></div>
            <div>${IC.up}<b class="num">${E(S.gain != null ? '+' + r1(S.gain) : '—')}</b><span>Retake gain (pts)</span></div>
          </div>
          <div class="ins"><b>${IC.star}Key insight</b><div>${E(esc(S.insight))}</div></div>
        </div>
        ${progEntry ? `<div class="qfloat"><span class="ok">${IC.check}</span><div><b>${E(PCAT[progEntry[1][2]][0])}</b><small>${E(progEntry[0] + ' · ' + r1(progEntry[1][0]) + '% → ' + r1(progEntry[1][1]) + '%')}</small></div></div>` : ''}
      </div>
    </div>
  </div>

  ${sec('Attainment and progress', 'school assessments, as held in iAspire')}
  <div class="tcard"><table>
    <tr><th>Subject</th><th class="c">Mark</th><th>Attainment</th><th>Progress between exams</th><th class="c">Prepare</th><th class="c">Test</th><th class="c">Ch / tests</th></tr>
    ${rows}
  </table></div>
  <p class="tnote">${E(`Attainment: 70%+ Above expectation, 50–69% In line, under 50% Below. Progress compares two school exams by ten-point band.${S.progNote ? ' ' + S.progNote : ''} Prepare is the average first try on diagnostic tests before teaching; Test, on quizzes after teaching.`)}</p>

  ${sec('The EduBrisk learning cycle', 'every chapter: prepare, learn, test, celebrate')}
  <div class="cycle">
    <div class="st s1"><div class="hd">${icon('search', 'blue')}<i>Step 1</i></div><div class="lab">Prepare</div><b class="num">${E(pc(S.cycle.prep))}</b><span>${E('first try on diagnostic tests, before teaching')}</span></div>
    <div class="st s2"><div class="hd">${icon('book', 'green')}<i>Step 2</i></div><div class="lab">Learn</div><b class="num">${E(S.cycle.chapters + ' chapters')}</b><span>${E(hm(S.hours) + ' of study across ' + subs.filter((s) => (S.subj || {})[s]).length + ' subjects')}</span></div>
    <div class="st s3"><div class="hd">${icon('pen', 'purple')}<i>Step 3</i></div><div class="lab">Test</div><b class="num">${E(pc(S.cycle.test))}</b><span>${E('first try on quizzes after teaching')}</span></div>
    <div class="st s4"><div class="hd">${icon('trophy', 'amber')}<i>Step 4</i></div><div class="lab">Celebrate</div><b class="num">${E(S.gain != null ? '+' + r1(S.gain) : '—')}</b><span>${E('points gained across ' + S.retaken + ' retaken tests')}</span></div>
  </div>`, 'first');

/* ================================================================ page 2 */
const DOM = [['Awareness', 'knowing and communicating', 'd1', 'bulb', 'blue', ['Language and communication', 'Knowledge and understanding', 'Digital, health and environmental literacy']],
  ['Sensitivity', 'working with and caring for others', 'd2', 'users', 'green', ['Collaboration and teamwork', 'Empathy, values and respect', 'Citizenship and responsibility']],
  ['Creativity', 'thinking and making', 'd3', 'brain', 'amber', ['Critical thinking and problem-solving', 'Creativity and innovation', 'Scientific temper and curiosity']]];
const EVID = ['Group project', 'Individual inquiry', 'Classroom interaction', 'Co-curricular activity', 'Observation over the term'];
const tgtSubs = subs.filter((s) => (S.score || {})[s] != null || (S.prog || {})[s]);
H += page(`
  ${sec('Effort and ability', 'teacher judgment, 1 to 9, kept separate on purpose')}
  <div class="grid g2">
    <div class="card"><div class="ch">${icon('bolt', 'amber')}<div><b>Effort</b><small>how hard ${esc(S.first)} works</small></div></div>${scale(['1', '2', '3', '4', '5', '6', '7', '8', '9'], 'nine')}<div class="scalecap"><span>Low</span><span>Developing</span><span>High</span></div></div>
    <div class="card"><div class="ch">${icon('gauge', 'blue')}<div><b>Ability</b><small>what ${esc(S.first)} can do</small></div></div>${scale(['1', '2', '3', '4', '5', '6', '7', '8', '9'], 'nine')}<div class="scalecap"><span>Low</span><span>Developing</span><span>High</span></div></div>
  </div>

  ${sec('Targets', 'set by the subject teacher for the next exam')}
  <div class="tcard"><table class="plan tg"><tr><th style="width:22%">Subject</th><th>Base target</th><th>Challenge target</th><th>Support or extension</th></tr>
    ${tgtSubs.map((s) => `<tr><td class="subj">${sdot(s)}${s}</td><td>${ta(1)}</td><td>${ta(1)}</td><td>${ta(1)}</td></tr>`).join('')}
  </table></div>

  ${sec('Beyond the marks', 'levels the teacher has seen this term')}
  <div class="abil">${DOM.map(([d, sub, c, ic, col, xs]) => `<div class="dom ${c}"><div class="dh">${icon(ic, col)}<div><b>${d}</b><small>${sub}</small></div></div>${xs.map((x) => `<div class="it"><div class="n">${x}</div>${scale(['Beginner', 'Proficient', 'Advanced'], 'bpa')}<select><option value="">Seen in…</option>${EVID.map((e) => `<option>${e}</option>`).join('')}</select></div>`).join('')}</div>`).join('')}</div>

  ${sec('Interests', 'from the student, checked by the teacher')}
  <div class="grid g3">
    <div class="voice v2"><div class="ch">${icon('heart', 'green')}<div><b>I enjoy…</b></div></div>${lined(2)}</div>
    <div class="voice v3"><div class="ch">${icon('flag', 'amber')}<div><b>Clubs, sports and activities</b></div></div>${lined(2)}</div>
    <div class="voice v1"><div class="ch">${icon('target', 'blue')}<div><b>When I grow up I would like to…</b></div></div>${lined(2)}</div>
  </div>

  ${sec('Celebrate', 'achievements this term, in and out of class')}
  <div class="voice v4"><div class="ch">${icon('award', 'purple')}<div><b>Achievements and moments to celebrate</b></div></div>${lined(2)}</div>`);

/* ================================================================ page 3 */
H += page(`
  ${sec('Voices', 'the student, a classmate and the family')}
  <div class="grid g2">
    <div class="voice v1"><div class="ch">${icon('star', 'blue')}<div><b>The work I am proudest of this term</b></div><span class="who">Student</span></div>${lined(2)}</div>
    <div class="voice v1"><div class="ch">${icon('up', 'blue')}<div><b>Something I want to get better at</b></div><span class="who">Student</span></div>${lined(2)}</div>
    <div class="voice v1"><div class="ch">${icon('target', 'blue')}<div><b>My goal, and how I will know I've reached it</b></div><span class="who">Student</span></div>${lined(2)}</div>
    <div class="voice v4"><div class="ch">${icon('smile', 'purple')}<div><b>How I feel about school this term</b></div><span class="who">Student</span></div>${scale(['Not good', 'Okay', 'Good', 'Very good', 'Great'], 'mood')}</div>
    <div class="voice v2"><div class="ch">${icon('users', 'green')}<div><b>One thing ${esc(S.first)} does well, one suggestion</b></div><span class="who">Classmate</span></div>${lined(2)}</div>
    <div class="voice v3"><div class="ch">${icon('home', 'amber')}<div><b>What we notice at home, and how we will help</b></div><span class="who">Family</span></div>${lined(2)}</div>
  </div>

  ${sec("Teacher's note", 'drafted from the evidence; the class teacher edits and approves it')}
  <div class="note" id="sugNote"><div class="nh"><b>${IC.star}Strengths and areas to work on</b><span class="stamp" id="sugStamp">Suggested – teacher to review</span></div>
    ${ta(6, S.suggest.note, 'id="sugText"')}
    <label class="ok-l noprint"><input type="checkbox" id="sugOk"> I have reviewed this note and it can be issued.</label></div>

  ${sec('Support plan', 'prepared by the school from the evidence')}
  <div class="tcard"><table class="plan"><tr><th style="width:26%">Focus</th><th>Action</th><th style="width:17%">Who</th><th style="width:15%">Review by</th></tr>
    ${S.suggest.plan.map((r, n) => `<tr><td class="subj"><span class="k">${n + 1}</span>${E(esc(r[0]))}</td><td>${E(esc(r[1]))}</td><td>${E(esc(r[2]))}</td><td><span class="when">${E(esc(r[3]))}</span></td></tr>`).join('')}
  </table></div>

  <div class="sign"><div>Class teacher<span>Date</span></div><div>Principal<span>Date</span></div><div>Parent / guardian<span>Date</span></div></div>`);

$('#doc').innerHTML = H;
$('#tbName').textContent = `${S.name} · Grade ${S.g}${secL}`;

/* ================================================================ behaviour */
function fit(t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }
document.querySelectorAll('textarea:not(.lined)').forEach(fit);
document.addEventListener('input', (e) => { if (e.target.tagName === 'TEXTAREA') fit(e.target); });
window.addEventListener('beforeprint', () => document.querySelectorAll('textarea').forEach((t) => { if (!t.classList.contains('lined') || t.value) fit(t); }));
function sync() {
  const ok = $('#sugOk').checked;
  $('#sugNote').classList.toggle('ok', ok);
  $('#sugStamp').textContent = ok ? 'Reviewed by teacher' : 'Suggested – teacher to review';
}
document.addEventListener('change', sync); sync();

/* edit mode: every pre-filled figure and line of wording becomes typeable */
function setEdit(on) {
  document.body.classList.toggle('editing', on);
  document.querySelectorAll('[data-edit]').forEach((e) => { if (on) e.setAttribute('contenteditable', 'true'); else e.removeAttribute('contenteditable'); });
  $('#btnEdit').setAttribute('aria-pressed', on);
  $('#btnEdit').textContent = on ? 'Done editing' : 'Edit card text';
}
$('#btnEdit').onclick = () => setEdit(!document.body.classList.contains('editing'));
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.hasAttribute && e.target.hasAttribute('contenteditable')) { e.preventDefault(); e.target.blur(); } });

/* school logo: picked once, kept inside the file so a downloaded copy carries it */
const pickLogo = () => $('#logoFile').click();
$('#btnLogo').onclick = pickLogo;
document.addEventListener('click', (e) => { if (e.target.closest && e.target.closest('#slogo')) pickLogo(); });
$('#logoFile').onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { const s = $('#slogo'); s.classList.remove('empty'); s.innerHTML = `<img src="${rd.result}" alt="School logo">`; };
  rd.readAsDataURL(f);
};
$('#btnPrint').onclick = () => { setEdit(false); window.print(); };
/* the filled copy bakes every entry into the markup, so it reopens exactly as it was left */
$('#btnSave').onclick = () => {
  setEdit(false);
  document.querySelectorAll('input').forEach((i) => {
    if (i.type === 'checkbox' || i.type === 'radio') { if (i.checked) i.setAttribute('checked', ''); else i.removeAttribute('checked'); }
    else if (i.type !== 'file') i.setAttribute('value', i.value);
  });
  document.querySelectorAll('textarea').forEach((t) => { t.textContent = t.value; });
  document.querySelectorAll('select').forEach((s) => [...s.options].forEach((o) => { if (o.selected) o.setAttribute('selected', ''); else o.removeAttribute('selected'); }));
  const html = '<!DOCTYPE html>\n<html lang="en">' + document.documentElement.innerHTML
    .replace("$('#doc').innerHTML = H;", "if (!document.querySelector('#doc').children.length) $('#doc').innerHTML = H;") + '</html>';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  a.download = 'index.html';
  document.body.append(a); a.click(); a.remove();
};
</script>
</body>
</html>
